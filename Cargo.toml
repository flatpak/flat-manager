[package]
name = "flat-manager"
version = "0.5.3"
authors = ["Alexander Larsson <alexander.larsson@gmail.com>", "Bart Piotrowski <b@bpiotrowski.pl>"]
license = "MIT OR Apache-2.0"
default-run = "flat-manager"
edition = "2021"

[workspace]
members = ["common", "client"]
default-members = [".", "common", "client"]

# Vendored actix-multipart 0.7.2 with a one-line fix for a silent field-drop bug in
# the streaming parser (boundary delimiter split across a network chunk). See
# vendor/actix-multipart/README.flatmanager.md. Remove once fixed upstream.
[patch.crates-io]
actix-multipart = { path = "vendor/actix-multipart" }

[lib]
name = "flatmanager"
path = "src/lib.rs"

[[bin]]
name = "flat-manager"
path = "src/bin/flat-manager.rs"

[dependencies]
env_logger = "0.11"

actix = "0.13"
actix-files = "0.7"
actix-http = "3"
actix-multipart = "0.7"
actix-service = "2"
actix-web = "4"
askama = "0.16"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.4", features = ["postgres", "chrono", "serde_json", "r2d2"] }
diesel_migrations = { version = "2.4" }
dotenv = "0.15"
flat-manager-common = { path = "common" }
hex = "0.4"
jwt = { package = "jsonwebtoken", version = "12.0.0", features = ["aws_lc_rs"] }
log = "0.4"
libc = "0.2"
libostree = { package = "ostree", version = "0.20.5", features = ["v2021_5"] }
r2d2 = "0.8"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1.54", features = ["time", "macros", "rt", "rt-multi-thread", "process", "signal", "fs", "io-util", "sync"] }
walkdir = "2"
futures = "0.3"
pin-project-lite = "0.2.18"
prometheus-client = "0.26.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
aws-lc-rs = "1.19"
